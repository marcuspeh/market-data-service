[project]
name = "market-data-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asyncmy>=0.2.13",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "ibapi>=9.81.1.post1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
    "tortoise-orm>=1.1.7",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Tortoise emits a noisy warning when no real DB is configured;
    # silence it for the test run.
    "ignore::DeprecationWarning:tortoise.*",
]