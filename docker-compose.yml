name: market-data-service

services:
  market-data:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: market-data
    environment:
      DATA_DIR: /var/lib/market-data
      POLYGON_API_KEY: ${POLYGON_API_KEY}

      # Longbridge OpenAPI credentials (developer center).
      LONGBRIDGE_APP_KEY: ${LONGBRIDGE_APP_KEY}
      LONGBRIDGE_APP_SECRET: ${LONGBRIDGE_APP_SECRET}
      LONGBRIDGE_ACCESS_TOKEN: ${LONGBRIDGE_ACCESS_TOKEN}
      LONGBRIDGE_TIMEOUT_SECONDS: ${LONGBRIDGE_TIMEOUT_SECONDS:-10}
      
    ports:
      - "${APP_PORT:-3556}:8001"
    volumes:
      - /home/marcuspeh/data/market-data:/var/lib/market-data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8001' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s